appId: io.hangram.app
productName: Hangram
directories:
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources/bin
    to: bin
  - from: resources/telegram
    to: telegram
asar: true
mac:
  category: public.app-category.social-networking
  target: [dmg]
  # Ad-hoc signature: enough to run locally on Apple silicon. Use a Developer ID to distribute.
  identity: '-'
  hardenedRuntime: false
  icon: build/icon.icns
  # Keep Telegram's own signature intact.
  signIgnore:
    - Contents/Resources/telegram
  extendInfo:
    NSFaceIDUsageDescription: Unlock the account vault
win:
  target: [nsis]
  icon: build/icon.png
linux:
  target: [AppImage]
  icon: build/icon.png
  category: Network
